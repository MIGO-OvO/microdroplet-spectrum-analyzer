[package]
name = "microdroplet-spectrum-analyzer"
version = "0.1.0"
description = "Offline microdroplet spectrum and signal analysis workstation"
authors = ["Microdroplet Spectrum Analyzer contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "microdroplet_spectrum_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
calamine = "0.36.1"
csv = "1.4.0"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "point_series", "ttf"] }
rust_xlsxwriter = "0.99.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.23.0"
